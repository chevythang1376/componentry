<!doctype html>
<meta charset="utf-8">
<title>Componentry — shipped defaults</title>
<style>
  body { font: 14px/1.6 system-ui; margin: 24px; color: #141210; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b625a; margin: 0 0 18px; max-width: 70ch; }
  #out { white-space: pre-wrap; font: 12.5px/1.7 ui-monospace, Menlo, Consolas, monospace; }
  .bar { padding: 10px 14px; border-radius: 8px; font-weight: 700; margin-bottom: 16px; }
  .ok { background: #e8f4ea; color: #14532d; }
  .bad { background: #fdeaea; color: #7f1d1d; }
</style>
<h1>Shipped defaults</h1>
<p class="sub">What a brand new project looks like before anyone touches a control. These
are deliberate choices rather than accidents of the code, so they are pinned here — a
default that quietly reverts is not something you would notice until an export was
already out the door.</p>
<div id="bar" class="bar">running…</div>
<div id="out"></div>
<!-- Loaded with a timestamp so a test page can never report on stale
     source. None of these carried a version query, and bump.sh only
     versions index.html, so a cached copy turns a real result into a
     misleading one — which is exactly how an intermittent carousel
     failure survived two rounds of "fixes". -->
<script>
  ['core.js', 'components/content.js', 'components/heroes.js', 'components/interactive.js', 'components/media.js', 'components/modern.js', 'components/product.js', 'components/diagram.js', 'components/territory.js', 'export.js'
  ].forEach(function (f) {
    document.write('<scr' + 'ipt src="../js/' + f + '?t=' + Date.now() + '"><\/scr' + 'ipt>');
  });
</script>
<script>
var log = [], pass = 0, fail = 0;
function check(name, got, want) {
  var ok = String(got) === String(want);
  ok ? pass++ : fail++;
  log.push((ok ? 'PASS  ' : 'FAIL  ') + name + '\n        got ' + got + (ok ? '' : '\n        want ' + want));
}
function tok(over) { return Object.assign({}, CB.DEFAULT_TOKENS, over || {}); }
function css(over) {
  var def = CB.get('card-grid');
  return CB.Export.parts([{ uid: 'u', type: 'card-grid', cls: 'cb-cg-d', props: CB.defaults(def) }],
                         tok(over), {}).css;
}

var INTER = 'https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap';

// --- the three defaults --------------------------------------------------
check('font stack is the private Inter, then Inter and a real fallback',
      CB.fontStack(tok()), '"cb Inter", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif');
check('button corners are 1px', (css().match(/--cb-btn-radius:[^;]*/) || [''])[0], '--cb-btn-radius: 1px');
check('the corner radius token is untouched', (css().match(/--cb-radius:[^;]*/) || [''])[0], '--cb-radius: 14px');

// --- Inter has to actually arrive, not just be named ---------------------
check('Inter is the webfont in use, not merely hoped for', CB.fontImports(tok()).join('|'), INTER);
check('the weights cover what the components ask for (500-800)', /wght@400\.\.800/.test(INTER), true);

// --- ...and arrive for the blocks alone ----------------------------------
/* A font's family name belongs to the whole document. Importing Google's
   stylesheet gave "Inter" to the host page too, and any host text whose stack
   named Inter switched to it: reported from SmartEdit as other components'
   fonts changing with the font token. The faces are declared under a name only
   the blocks use instead. */
var faceFamilies = function (c) {
  return (c.match(/@font-face\s*\{[^}]*\}/g) || []).map(function (r) { return (r.match(/font-family:\s*"([^"]+)"/) || [])[1]; });
};
check('the export has no @import, which would hand the family to the host page',
      /@import/.test(css()), false);
check('Inter is declared for every script Google serves it in', faceFamilies(css()).length, 7);
check('every face is under the private name',
      faceFamilies(css()).every(function (f) { return f === 'cb Inter'; }), true);
check('and every file is Google’s own, over https',
      (css().match(/@font-face\s*\{[^}]*\}/g) || []).every(function (r) {
        return /src: url\("https:\/\/fonts\.gstatic\.com\/s\/inter\/v\d+\/[\w-]+\.woff2"\) format\("woff2"\);/.test(r);
      }), true);
check('the faces come before every block rule', css().indexOf('@font-face') < css().indexOf('.cb-'), true);

// --- and the other stacks stay local -------------------------------------
check('System UI imports nothing', CB.fontImports(tok({ font: 'system' })).length, 0);
check('grotesk is the local-only twin, still no import',
      CB.fontImports(tok({ font: 'grotesk' })).length, 0);
check('grotesk names the same family, without the private copy',
      CB.fontStack(tok({ font: 'grotesk' })), CB.fontStack(tok()).replace('"cb Inter", ', ''));
check('and declares no font', /@font-face/.test(css({ font: 'grotesk' })), false);

// --- a custom import -----------------------------------------------------
var custom = 'https://fonts.googleapis.com/css2?family=Fraunces&display=swap';
check('a custom import is used alongside the built-in',
      CB.fontImports(tok({ fontImport: custom })).join('|'), INTER + '|' + custom);
check('a custom import is not used twice',
      CB.fontImports(tok({ font: 'import', fontImport: INTER })).join('|'), INTER);
check('junk in the import field is ignored',
      CB.fontImports(tok({ font: 'system', fontImport: 'not a url' })).length, 0);

/* What Google sends for that address, trimmed to two scripts, plus what other
   providers have been seen to add: a class rule and a tracking @import. */
var GOOGLE = "/* latin-ext */\n@font-face {\n  font-family: 'Fraunces';\n  font-style: normal;\n  font-weight: 400;\n" +
  "  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/fraunces/v38/abc-ext.woff2) format('woff2');\n" +
  "  unicode-range: U+0100-02BA, U+02BD-02C5;\n}\n/* latin */\n@font-face {\n  font-family: 'Fraunces';\n" +
  "  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n" +
  "  src: url(https://fonts.gstatic.com/s/fraunces/v38/abc.woff2) format('woff2');\n  unicode-range: U+0000-00FF;\n}\n" +
  "@import url('https://p.example.net/track.css');\n.tk-fraunces { font-family: 'Fraunces', serif; }\n";
var read = CB.parseFontFaces(GOOGLE);
var withFaces = function (over) { return tok(Object.assign({ fontImport: custom, fontFaces: { url: custom, faces: read } }, over)); };
var cssWith = function (over) {
  var def = CB.get('card-grid');
  return CB.Export.parts([{ uid: 'u', type: 'card-grid', cls: 'cb-cg-d', props: CB.defaults(def) }], withFaces(over), {}).css;
};
check('reading a stylesheet keeps its @font-face rules and nothing else', read.length, 2);
check('with its faces read, choosing the import uses the private copy first',
      CB.fontStack(withFaces({ font: 'import' })).indexOf('"cb Fraunces", "Fraunces"'), 0);
check('and the export declares it rather than importing it',
      /@import/.test(cssWith({ font: 'import' })) + ' ' + faceFamilies(cssWith({ font: 'import' })).join('|'),
      'false cb Fraunces|cb Fraunces');
check('the provider’s class rule and tracking import stay out of the export',
      /tk-fraunces|p\.example\.net/.test(cssWith({ font: 'import' })), false);
check('a custom stack that names the imported family finds the private copy',
      CB.fontStack(withFaces({ font: 'custom', fontCustom: "'Fraunces', Georgia, serif" })),
      '"cb Fraunces", \'Fraunces\', Georgia, serif');
check('faces read for another address are never used for this one',
      CB.fontSources(withFaces({ font: 'import', fontImport: 'https://fonts.googleapis.com/css2?family=Lora' })).imports.join('|'),
      'https://fonts.googleapis.com/css2?family=Lora');
check('until its faces are read, the import falls back to @import, first in the CSS',
      css({ font: 'import', fontImport: custom }).indexOf('@import url("' + custom + '")'), 0);
check('and choosing it still switches the family',
      CB.fontStack(tok({ font: 'import', fontImport: custom })).indexOf('"Fraunces"'), 0);

/* Faces reach the export from a stylesheet someone named, by way of a saved
   project that could have come from anywhere. None of this may survive. */
var EVIL = [
  { family: 'X<\/style><script>alert(1)<\/script>', src: 'url(https://a.example/x.woff2)' },
  { family: 'Plain', src: 'url(javascript:alert(1))' },
  { family: 'Plain', src: 'url(http://insecure.example/x.woff2)' },
  { family: 'Plain', src: 'url(https://a.example/x.woff2"<\/style>)' },
  { family: 'Plain', src: 'url(https://a.example/x.woff2)', weight: '400;} body{color:red' },
  { family: 'Plain', src: 'url(https://a.example/x.woff2)', range: 'U+0000-00FF; } * { display: none' }
];
var evilCss = cssWith({ font: 'import', fontFaces: { url: custom, faces: EVIL } });
check('a face whose family or file could break out of the <style> is dropped',
      /<\/style>|<script|javascript:|http:\/\/insecure/.test(evilCss), false);
check('a bad weight or range is dropped back to its default, not written out',
      /color:\s*red|display:\s*none|\}\s*body|\*\s*\{/.test((evilCss.match(/@font-face\s*\{[^}]*\}/g) || []).join('\n')) ||
      /body\s*\{\s*color:\s*red/.test(evilCss), false);
check('the faces that were safe still make it, with the bad values reset',
      faceFamilies(evilCss).join('|'), 'cb Plain|cb Plain');

// --- exports must survive the font never loading -------------------------
check('the stack falls back to something real if the import is stripped',
      /Helvetica Neue|Helvetica|Arial|sans-serif/.test(CB.fontStack(tok())), true);

// --- a parallax, new and as saved before its controls changed ------------
/* The old single strength slider moved the photo faster than the page. A
   saved banner has to open as what was asked for: still if it was set to 0,
   and at a matching depth otherwise. */
function oldBanner(speed) {
  return CB.migrate([{ uid: 'u', cls: 'cb-px-o', type: 'parallax-banner', props: { title: 'Old', speed: speed } }])[0].props;
}
check('a new banner moves its photo slower than the page',
      CB.defaults(CB.get('parallax-banner')).motion + ' ' + CB.defaults(CB.get('parallax-banner')).depth, 'depth 40');
check('a banner saved with no movement still has none', oldBanner(0).motion, 'none');
check('the old default opens on the new default', oldBanner(30).motion + ' ' + oldBanner(30).depth, 'depth 40');
check('the strongest old setting stays strong', oldBanner(60).depth, 80);
check('and the retired setting is not carried along', 'speed' in oldBanner(30), false);
check('opening it again changes nothing',
      JSON.stringify(CB.migrate([{ uid: 'u', cls: 'c', type: 'parallax-banner', props: oldBanner(45) }])[0].props),
      JSON.stringify(oldBanner(45)));

// --- sample copy that counts the library ---------------------------------
/* Two blocks ship sample copy that quotes how many blocks there are. It
   said 41 long after there were 44, and nothing noticed, so the number is
   read against the registry: add a block and these fail until it is right. */
var blocks = CB.all().length;
check('the Stats Counter sample counts every block',
      CB.defaults(CB.get('stats-counter')).items[0].value, blocks);
check('the Pricing Table sample counts every block',
      (/All (\d+) components/.exec(CB.defaults(CB.get('pricing')).items[0].features) || [])[1], blocks);

document.getElementById('out').textContent = log.join('\n');
var bar = document.getElementById('bar');
bar.className = 'bar ' + (fail ? 'bad' : 'ok');
bar.textContent = fail ? (fail + ' failed, ' + pass + ' passed') : (pass + '/' + pass + ' passed');
document.title = fail ? 'DEFAULTS FAIL ' + fail : 'DEFAULTS OK ' + pass;
</script>
