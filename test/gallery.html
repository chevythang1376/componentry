<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Componentry — export smoke test</title>
<style>
  html, body { margin: 0; }
  body { font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  .tst-bar {
    position: sticky; top: 0; z-index: 9999;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: #0c0f16; color: #e6ebf3;
    border-bottom: 1px solid #262d3c; font-size: 13px;
  }
  .tst-bar strong { font-weight: 700; }
  .tst-bar code { font-family: ui-monospace, Consolas, monospace; color: #d7a97f; }
  .tst-ok { color: #4ade80; } .tst-bad { color: #fb7185; }
  .tst-label {
    padding: 6px 16px; background: #eef1f7; color: #475569;
    font: 700 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase;
    border-top: 1px solid #cbd5e1;
  }
</style>
</head>
<body>
<div class="tst-bar" id="bar">Building…</div>
<div id="out"></div>

<!-- Loaded with a timestamp so a test page can never report on stale
     source. None of these carried a version query, and bump.sh only
     versions index.html, so a cached copy turns a real result into a
     misleading one — which is exactly how an intermittent carousel
     failure survived two rounds of "fixes". -->
<script>
  ['core.js', 'components/heroes.js', 'components/content.js', 'components/interactive.js', 'components/media.js', 'components/modern.js', 'components/product.js', 'components/diagram.js', 'components/territory.js', 'export.js'
  ].forEach(function (f) {
    document.write('<scr' + 'ipt src="../js/' + f + '?t=' + Date.now() + '"><\/scr' + 'ipt>');
  });
</script>
<!-- For the sample content a deliberately empty component needs. Same
     timestamp treatment, and it lives beside this file rather than under js/,
     so bump.sh never rewrites it. -->
<script>document.write('<scr' + 'ipt src="probes.js?t=' + Date.now() + '"><\/scr' + 'ipt>');</script>
<script>
/* Renders every component through the real export pipeline, into the real
   document — so what you interact with here is exactly what a user pastes. */
(function () {
  var tokens = CB.DEFAULT_TOKENS;
  var out = document.getElementById('out');
  var allCss = [], allJs = [], errors = [], sizes = [], alone = [];

  CB.all().forEach(function (def, n) {
    var inst = {
      uid: 'test' + n,
      cls: 'cb-' + def.id + '-' + Math.random().toString(36).slice(2, 7),
      type: def.id,
      props: Object.assign(CB.defaults(def), CBProbe.sampleFor(def.id))
    };
    var built;
    try {
      built = CB.build(inst, tokens);
    } catch (e) {
      errors.push(def.id + ': ' + e.message);
      return;
    }
    if (/failed to render/.test(built.html)) { errors.push(def.id + ': render threw'); return; }

    var label = document.createElement('div');
    label.className = 'tst-label';
    label.textContent = def.id;
    out.appendChild(label);

    var holder = document.createElement('div');
    holder.innerHTML = built.html;
    out.appendChild(holder);

    allCss.push(built.css);
    allJs.push(built.js);
    alone.push({ id: def.id, html: built.html, css: built.css });
    sizes.push({ id: def.id, kb: ((built.html.length + built.css.length + built.js.length) / 1024).toFixed(1) });
  });

  var style = document.createElement('style');
  style.textContent = allCss.join('\n');
  document.head.appendChild(style);

  // Run the generated behaviour the same way a pasted <script> would.
  var jsErrors = [];
  allJs.forEach(function (src, i) {
    if (!src.trim()) return;
    try { (0, eval)(src); }
    catch (e) { jsErrors.push(CB.all()[i].id + ': ' + e.message); }
  });

  /* Layout stability. Every image that is actually laid out must have a known
     box before its file arrives, or the page jumps as it loads — which is the
     visitor-facing half of Cumulative Layout Shift and the easiest of the Core
     Web Vitals to get wrong by omission.

     A ratio, explicit attributes, a stated height, or an absolute fill all
     count. Naively looking only for aspect-ratio reports two thirds of the
     library as broken when the space is reserved by a fixed-height parent. */
  var shifty = [];
  Array.prototype.forEach.call(document.querySelectorAll('img'), function (im) {
    var r = im.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;              // not laid out; cannot shift
    var cs = getComputedStyle(im);
    if (cs.aspectRatio !== 'auto') return;
    if (im.hasAttribute('width') && im.hasAttribute('height')) return;
    if (cs.height !== 'auto' && parseFloat(cs.height) > 0) return;
    var holder = im.closest('.tst-holder, [class^=cb-]');
    shifty.push((holder && holder.className || 'img').toString().split(' ')[0]);
  });
  if (shifty.length) {
    errors.push(shifty.length + ' image(s) reserve no space: ' +
                shifty.filter(function (v, i, a) { return a.indexOf(v) === i; }).slice(0, 4).join(', '));
  }

  /* Phone width. A block wider than the screen makes the whole host page
     scroll sideways, and the usual cause hides from a look at the block: an
     absolutely positioned element inside a scroll box whose containing block
     sits outside it, so the box cannot clip it. The Table's screen-reader
     "Yes" and "No" did exactly that from its off-screen columns, while the
     table itself scrolled correctly inside its frame.

     Each block is laid out alone in a 390px frame, without its script, which
     is how it first paints and how it stays where an editor strips scripts. */
  var wide = [], small = [];
  var frame = document.createElement('iframe');
  frame.style.cssText = 'position: absolute; left: -9999px; top: 0; width: 390px; height: 844px; border: 0;';
  document.body.appendChild(frame);
  alone.forEach(function (b) {
    var d = frame.contentDocument;
    d.open();
    d.write('<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1">' +
            '<style>html, body { margin: 0; }\n' + b.css + '</style>' + b.html);
    d.close();
    var over = d.documentElement.scrollWidth - d.documentElement.clientWidth;
    if (over > 0) wide.push(b.id + ' (' + over + 'px)');
    tooSmall(d).forEach(function (what) { small.push(b.id + ' ' + what); });
  });
  frame.remove();
  if (wide.length) errors.push(wide.length + ' block(s) wider than a phone: ' + wide.join(', '));
  if (small.length) errors.push(small.length + ' target(s) too small to tap: ' + small.slice(0, 4).join(', '));

  /* Touch targets, at the same phone width. WCAG 2.2 asks for 24px, or for a
     smaller target to sit in a clear 24px circle that reaches no other
     target. The Carousel's and Testimonial's 9px dots, 17px apart, had
     neither. A link inside running text is exempt, as WCAG exempts it.

     What counts is where a tap lands, not the box. A radio hidden inside a
     label is not a target: the label is. And a small box can draw a bigger
     tap area round itself, as the Hero Slider's 10px dots do with a 44px
     ::after, so a box under 24px that a tap anywhere in its 24px circle
     still reaches is big enough. */
  function tooSmall(d) {
    var win = d.defaultView;
    var all = Array.prototype.filter.call(d.querySelectorAll(
      'a[href], button, label, select, textarea, summary, input:not([type=hidden]), [role=button], [role=tab]'
    ), function (el) {
      var r = el.getBoundingClientRect();
      if (r.width <= 1 || r.height <= 1) return false;
      if (el.tagName === 'INPUT' && (el.closest('label') ||
          (el.labels && el.labels.length && +win.getComputedStyle(el).opacity < 0.1))) return false;
      var cs = win.getComputedStyle(el);
      if (cs.visibility === 'hidden' || cs.pointerEvents === 'none') return false;
      return !(el.tagName === 'A' && cs.display === 'inline');
    }).map(function (el) {
      var r = el.getBoundingClientRect();
      return { el: el, r: r, small: r.width < 23.5 || r.height < 23.5 };
    });
    function gap(x, y, r) {
      var dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
      return Math.sqrt(dx * dx + dy * dy);
    }
    function reaches(a) {
      a.el.scrollIntoView({ block: 'center', inline: 'center' });
      var r = a.el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      for (var k = 0; k < 8; k++) {
        var hit = d.elementFromPoint(x + 11.5 * Math.cos(k * Math.PI / 4), y + 11.5 * Math.sin(k * Math.PI / 4));
        if (!hit || !a.el.contains(hit)) return false;
      }
      return true;
    }
    all.forEach(function (a) { if (a.small && reaches(a)) a.small = false; });
    d.documentElement.scrollTop = 0;
    all.forEach(function (a) {
      a.r = a.el.getBoundingClientRect();
      a.x = a.r.left + a.r.width / 2; a.y = a.r.top + a.r.height / 2;
    });
    return all.filter(function (a) {
      return a.small && all.some(function (b) {
        if (b === a || a.el.contains(b.el) || b.el.contains(a.el)) return false;
        return gap(a.x, a.y, b.r) < 12 ||
               (b.small && Math.hypot(a.x - b.x, a.y - b.y) < 24);
      });
    }).map(function (a) {
      return (a.el.className || a.el.tagName).toString().split(' ')[0] +
             ' ' + Math.round(a.r.width) + 'x' + Math.round(a.r.height);
    });
  }

  /* Lists that are still lists. A role on an <li> replaces its list-item role,
     which leaves the <ul> round it a list of nothing: the Carousel's slides
     did that, and every accessibility checker reports it. */
  var lists = [];
  Array.prototype.forEach.call(out.querySelectorAll('ul:not([role]), ol:not([role])'), function (l) {
    var broken = Array.prototype.some.call(l.children, function (k) {
      if (k.tagName === 'SCRIPT' || k.tagName === 'TEMPLATE') return false;
      return k.tagName !== 'LI' || (k.hasAttribute('role') && k.getAttribute('role') !== 'listitem');
    });
    if (broken) lists.push(l.className.toString().split(' ')[0] || 'list');
  });
  if (lists.length) errors.push(lists.length + ' list(s) holding something other than list items: ' + lists.join(', '));

  /* Heading levels. The export moves every heading in a block down by the
     level chosen under Advanced, so H3 has to come out exactly one level below
     H2, heading for heading. Kinetic Text chose its own level as well and was
     moved twice, so H3 came out an h4 and skipped a level in the outline. */
  var shifted = [];
  CB.all().forEach(function (def, n) {
    function levels(h) {
      var props = Object.assign(CB.defaults(def), CBProbe.sampleFor(def.id), { _heading: h });
      var html = CB.build({ uid: 'h' + n, cls: 'cb-h-' + def.id, type: def.id, props: props }, tokens).html;
      return (html.match(/<h[1-6]\b/gi) || []).map(function (t) { return +t[2]; });
    }
    var two = levels('2'), three = levels('3');
    var same = two.length === three.length && two.every(function (l, i) { return three[i] === Math.min(6, l + 1); });
    if (!same) shifted.push(def.id + ' (h' + two.join(',h') + ' became h' + three.join(',h') + ')');
  });
  if (shifted.length) errors.push(shifted.length + ' block(s) move a heading the wrong distance: ' + shifted.join(', '));

  window.__test = {
    errors: errors, jsErrors: jsErrors, sizes: sizes,
    shifty: shifty.length, wide: wide, small: small, shifted: shifted, lists: lists,
    count: CB.all().length
  };

  var bar = document.getElementById('bar');
  var bad = errors.length + jsErrors.length;
  bar.innerHTML =
    '<strong>Componentry export smoke test</strong>' +
    '<span><code>' + CB.all().length + '</code> components</span>' +
    '<span class="' + (bad ? 'tst-bad' : 'tst-ok') + '">' +
      (bad ? bad + ' failure(s): ' + errors.concat(jsErrors).join(' · ')
           : 'all rendered, initialised, reserving space for their images, no wider than a phone, ' +
             'big enough to tap, with lists that are lists, and moving their headings by the level chosen') +
    '</span>';
})();
</script>
</body>
</html>
