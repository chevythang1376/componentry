<!doctype html>
<meta charset="utf-8">
<title>Componentry — preflight</title>
<style>
  body { font: 14px/1.6 system-ui; margin: 24px; color: #141210; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b625a; margin: 0 0 18px; }
  #out { white-space: pre-wrap; font: 12.5px/1.7 ui-monospace, Menlo, Consolas, monospace; }
  .bar { padding: 10px 14px; border-radius: 8px; font-weight: 700; margin-bottom: 16px; }
  .ok { background: #e8f4ea; color: #14532d; }
  .bad { background: #fdeaea; color: #7f1d1d; }
</style>
<h1>Preflight</h1>
<p class="sub">Findings must be actionable. A warning that fires on every fresh
project is noise, and noise is what makes the real findings get ignored.</p>
<div id="bar" class="bar">running…</div>
<div id="out"></div>
<!-- Loaded with a timestamp so a test page can never report on stale
     source. None of these carried a version query, and bump.sh only
     versions index.html, so a cached copy turns a real result into a
     misleading one — which is exactly how an intermittent carousel
     failure survived two rounds of "fixes". -->
<script>
  ['core.js', 'components/content.js', 'components/heroes.js', 'components/interactive.js', 'components/media.js', 'components/modern.js', 'components/product.js', 'components/diagram.js', 'export.js', 'preflight.js'
  ].forEach(function (f) {
    document.write('<scr' + 'ipt src="../js/' + f + '?t=' + Date.now() + '"><\/scr' + 'ipt>');
  });
</script>
<script>
var log = [], pass = 0, fail = 0;
function check(name, got, want) {
  var ok = String(got) === String(want);
  ok ? pass++ : fail++;
  log.push((ok ? 'PASS  ' : 'FAIL  ') + name + '  got ' + got + (ok ? '' : '  want ' + want));
}
function inst(type, props) {
  var def = CB.get(type);
  return { uid: 'u', type: type, cls: 'cb-' + type + '-pf',
           props: Object.assign(CB.defaults(def), props || {}) };
}
function altFindings(list) {
  return (CB.Preflight.run(list, Object.assign({}, CB.DEFAULT_TOKENS), {}) || [])
    .filter(function (f) { return /alt text/.test(f.title); });
}

window.addEventListener('load', function () {
  // --- what ph() makes is recognisable, whatever it was asked for ----------
  check('recognises a default placeholder', CB.isPlaceholder(CB.ph(800, 600, '', '#96694c', '#2b241f')), true);
  check('recognises one at another size and palette', CB.isPlaceholder(CB.ph(120, 90, 'x', '#000', '#fff')), true);
  check('a real URL is not a placeholder', CB.isPlaceholder('https://example.com/photo.jpg'), false);
  check('an uploaded raster is not a placeholder', CB.isPlaceholder('data:image/png;base64,iVBORw0KGgo='), false);
  check('empty is not a placeholder', CB.isPlaceholder(''), false);
  check('undefined is not a placeholder', CB.isPlaceholder(undefined), false);

  // --- a fresh project is quiet -------------------------------------------
  var everything = CB.all().map(function (d, i) {
    var x = inst(d.id); x.uid = 'u' + i; x.cls = 'cb-' + d.id + '-pf'; return x;
  });
  check('no alt warnings on ' + everything.length + ' untouched components', altFindings(everything).length, 0);

  // --- but it still catches a real image with no description --------------
  var real = altFindings([inst('split-hero', { image: 'https://example.com/team.jpg', alt: '' })]);
  check('a real image with blank alt warns', real.length, 1);
  check('and says so plainly', real.length ? real[0].title : '', 'An image has no alt text');

  check('filling the alt clears it',
        altFindings([inst('split-hero', { image: 'https://example.com/team.jpg', alt: 'The team at work' })]).length, 0);

  // --- inside a repeatable list, per item ---------------------------------
  var cards = CB.defaults(CB.get('card-grid')).items;
  cards[0].image = 'https://example.com/a.jpg';
  cards[1].image = 'https://example.com/b.jpg';
  var listed = altFindings([inst('card-grid', { items: cards })]);
  check('two replaced cards, both undescribed', listed.length ? listed[0].title : '', '2 images have no alt text');

  cards[0].alt = 'A described card';
  listed = altFindings([inst('card-grid', { items: cards })]);
  check('describing one leaves one', listed.length ? listed[0].title : '', 'An image has no alt text');

  // A field pair that exists but has no image is not a missing description —
  // a colour tile in a mixed list carries an alt box it never uses.
  check('an item with no image at all is not flagged',
        altFindings([inst('mosaic-grid')]).length, 0);

  // --- a background the component itself marks decorative is not flagged ---
  // Parallax Banner has no alt field: its image is role="presentation" and the
  // headline carries the meaning. Preflight should say nothing, even once a
  // real image is in, rather than demanding a description of a backdrop.
  check('a decorative backdrop is not flagged',
        altFindings([inst('parallax-banner', { image: 'https://example.com/bg.jpg' })]).length, 0);

  /* --- images that live at a URL ------------------------------------------
     Two failures that cannot be seen from the markup: a link that has stopped
     resolving, and a master far bigger than the box it is poured into. Both
     depend on actually loading the file, so the findings are driven off the
     probe cache — seeded here, rather than reaching the network from a test,
     which would make the suite depend on somebody else's uptime. */
  function imageFindings(list) {
    return (CB.Preflight.run(list, Object.assign({}, CB.DEFAULT_TOKENS), {}) || [])
      .filter(function (f) { return /image link|larger than/.test(f.title); });
  }
  function seed(url, rec) { CB.Preflight.probes[url] = rec; }

  var GOOD = 'https://dam.example.com/right-size.jpg';
  var DEAD = 'https://dam.example.com/expired.jpg';
  var HUGE = 'https://dam.example.com/master.jpg';

  // A card image lays out around 350px wide at the 1280px test width.
  seed(GOOD, { state: 'ok', w: 700, h: 525 });
  seed(DEAD, { state: 'error', w: 0, h: 0 });
  seed(HUGE, { state: 'ok', w: 4000, h: 3000 });

  function withCardImage(src) {
    var cards = CB.defaults(CB.get('card-grid')).items.slice(0, 1);
    cards[0].image = src;
    cards[0].alt = 'Described, so only the image finding shows';
    return imageFindings([inst('card-grid', { items: cards })]);
  }

  var dead = withCardImage(DEAD);
  check('a link that no longer resolves is an error', dead.length ? dead[0].level : '', 'error');
  check('and says so in the title', dead.length ? dead[0].title : '', 'An image link is not loading');
  check('and warns that a cached copy hides it here',
        dead.length ? /cached/.test(dead[0].detail) : false, true);

  var huge = withCardImage(HUGE);
  check('a master far bigger than its box is a warning', huge.length ? huge[0].level : '', 'warn');
  check('and names the real size', huge.length ? /4000×3000/.test(huge[0].detail) : false, true);
  check('and sends you to the image library, not to an uploader',
        huge.length ? /rendition|resize/.test(huge[0].fix) : false, true);

  /* The threshold has to leave a correct 2x image alone, or the warning gets
     trained out of people on the images that were right all along. */
  check('an image sized for a 2x display is left alone', withCardImage(GOOD).length, 0);

  // Nothing to fetch and nothing that can 404.
  check('an inline image is never probed', CB.Preflight.probeImage('data:image/png;base64,AAAA'), null);
  check('and neither is an empty field', CB.Preflight.probeImage(''), null);

  /* A vector has no natural size worth comparing — it scales to whatever box
     it is given — so only the link check applies to one. */
  var VEC = 'https://dam.example.com/logo.svg';
  seed(VEC, { state: 'ok', w: 64, h: 64 });
  check('a vector is not judged on its pixel size', withCardImage(VEC).length, 0);
  seed(VEC, { state: 'error', w: 0, h: 0 });
  check('but a broken vector link still counts', withCardImage(VEC).length, 1);

  // Still in flight is not the same as fine, and must not report either way.
  seed('https://dam.example.com/slow.jpg', { state: 'pending', w: 0, h: 0 });
  check('an unfinished probe reports nothing yet',
        withCardImage('https://dam.example.com/slow.jpg').length, 0);


  document.getElementById('out').textContent = log.join('\n');
  var bar = document.getElementById('bar');
  bar.className = 'bar ' + (fail ? 'bad' : 'ok');
  bar.textContent = fail ? (fail + ' failed, ' + pass + ' passed')
                         : (pass + '/' + pass + ' passed — preflight only speaks when there is something to do');
  document.title = fail ? 'PREFLIGHT FAIL ' + fail : 'PREFLIGHT OK ' + pass;
});
</script>
