<!doctype html>
<meta charset="utf-8">
<title>Typography effect</title>
<style>
  body { font: 14px/1.5 system-ui; margin: 24px; }
  #out { white-space: pre-wrap; }
  .frames { position: absolute; left: -20000px; top: 0; }
  iframe { width: 1280px; height: 900px; border: 0; }
</style>
<h1>Typography effect — do the controls actually move anything?</h1>
<div id="out">running…</div>
<div class="frames"><iframe id="a"></iframe><iframe id="b"></iframe></div>
<!-- Loaded with a timestamp so a test page can never report on stale
     source. None of these carried a version query, and bump.sh only
     versions index.html, so a cached copy turns a real result into a
     misleading one — which is exactly how an intermittent carousel
     failure survived two rounds of "fixes". -->
<script>
  ['core.js', 'components/content.js', 'components/heroes.js', 'components/interactive.js', 'components/media.js', 'components/modern.js', 'components/product.js', 'components/diagram.js'
  ].forEach(function (f) {
    document.write('<scr' + 'ipt src="../js/' + f + '?t=' + Date.now() + '"><\/scr' + 'ipt>');
  });
</script>
<script>
/* A parity test alone would pass if the tokens were inert. Each case below
   moves one control and asserts the specific element it is meant to reach. */
var log = [], pass = 0, fail = 0;

function render(frame, type, tokens, props) {
  var def = CB.get(type);
  var inst = { type: type, cls: 'cb-' + type + '-t',
               props: Object.assign(CB.defaults(def), props || {}) };
  var r = CB.build(inst, Object.assign({}, CB.DEFAULT_TOKENS, tokens));
  var d = frame.contentDocument;
  d.open();
  d.write('<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style>' +
          '<style>' + r.css + '</style>' + r.html);
  d.close();
  return d;
}

function px(doc, win, sel, prop) {
  var el = doc.querySelector(sel);
  if (!el) return null;
  return win.getComputedStyle(el)[prop];
}

function check(name, got, want) {
  var ok = String(got) === String(want);
  ok ? pass++ : fail++;
  log.push((ok ? 'PASS  ' : 'FAIL  ') + name + '  got ' + got + (ok ? '' : '  want ' + want));
}
function changed(name, base, now) {
  var ok = base !== now && base != null && now != null;
  ok ? pass++ : fail++;
  log.push((ok ? 'PASS  ' : 'FAIL  ') + name + '  ' + base + ' -> ' + now);
}

window.addEventListener('load', function () {
  var A = document.getElementById('a'), B = document.getElementById('b');
  var wa = A.contentWindow, wb = B.contentWindow;

  // --- heading size -------------------------------------------------------
  var da = render(A, 'card-grid', {});
  var db = render(B, 'card-grid', { hScale: 1.5 });
  var s0 = parseFloat(px(da, wa, '.cb-cg__title', 'fontSize'));
  var s1 = parseFloat(px(db, wb, '.cb-cg__title', 'fontSize'));
  check('heading size 1.5x (clamp resolves 38px, x1.5 -> 57px)', s1, 57);
  check('heading size baseline unchanged', s0, 38);

  // --- heading kerning ----------------------------------------------------
  db = render(B, 'card-grid', { hTrack: 5 });
  // -.02em + .05em = .03em at 38px = 1.14px
  check('heading kerning +5/100em', px(db, wb, '.cb-cg__title', 'letterSpacing'), '1.14px');

  // --- heading leading ----------------------------------------------------
  db = render(B, 'card-grid', { hLeading: 25 });
  // 1.15 + .25 = 1.4 at 38px = 53.2px
  check('heading leading +25/100', px(db, wb, '.cb-cg__title', 'lineHeight'), '53.2px');

  // --- heading weight -----------------------------------------------------
  db = render(B, 'card-grid', { hWeight: 500 });
  check('heading weight 500', px(db, wb, '.cb-cg__title', 'fontWeight'), '500');
  check('heading weight reaches card titles too', px(db, wb, '.cb-cg__t', 'fontWeight'), '500');

  // --- eyebrow ------------------------------------------------------------
  da = render(A, 'timeline', {});
  db = render(B, 'timeline', { eyebrowScale: 1.5, eyebrowTrack: 6, eyebrowWeight: 500 });
  changed('eyebrow size', px(da, wa, '.cb-tl__date', 'fontSize'), px(db, wb, '.cb-tl__date', 'fontSize'));
  changed('eyebrow kerning', px(da, wa, '.cb-tl__date', 'letterSpacing'), px(db, wb, '.cb-tl__date', 'letterSpacing'));
  check('eyebrow weight 500', px(db, wb, '.cb-tl__date', 'fontWeight'), '500');
  check('eyebrow scale leaves the heading alone',
        px(da, wa, '.cb-tl__title', 'fontSize'), px(db, wb, '.cb-tl__title', 'fontSize'));

  // --- body ---------------------------------------------------------------
  da = render(A, 'parallax-banner', {});
  db = render(B, 'parallax-banner', { scale: 120 });
  changed('body size reaches the px-clamped hero lede',
          px(da, wa, '.cb-px__sub', 'fontSize'), px(db, wb, '.cb-px__sub', 'fontSize'));

  db = render(B, 'parallax-banner', { bodyTrack: 8 });
  check('body kerning +8/100em on the block root',
        px(db, wb, '.cb-parallax-banner-t', 'letterSpacing'), '1.28px');

  db = render(B, 'parallax-banner', { bodyLeading: 40 });
  // 1.6 + .4 = 2.0 at 16px = 32px
  check('body leading +40/100', px(db, wb, '.cb-parallax-banner-t', 'lineHeight'), '32px');

  // --- the component the user named --------------------------------------
  da = render(A, 'parallax-banner', {});
  db = render(B, 'parallax-banner', { hScale: 1.3, hTrack: 4 });
  changed('parallax headline size', px(da, wa, '.cb-px__title', 'fontSize'),
          px(db, wb, '.cb-px__title', 'fontSize'));
  changed('parallax headline kerning', px(da, wa, '.cb-px__title', 'letterSpacing'),
          px(db, wb, '.cb-px__title', 'letterSpacing'));

  // --- per-block override composes with the project value -----------------
  db = render(B, 'card-grid', { hScale: 1.2 }, { _hScale: 1.5 });
  // clamp resolves to 38px at 1280px, then 38 * 1.2 * 1.5 = 68.4
  check('per-block heading size multiplies the project value',
        px(db, wb, '.cb-cg__title', 'fontSize'), '68.4px');

  db = render(B, 'card-grid', { hTrack: 3 }, { _hTrack: 4 });
  // -.02em + .07em = .05em at 38px = 1.9px
  check('per-block kerning adds to the project value',
        px(db, wb, '.cb-cg__title', 'letterSpacing'), '1.9px');

  db = render(B, 'card-grid', {}, { _hScale: 1, _hTrack: 0, _bodyScale: 1 });
  check('per-block defaults emit nothing', px(db, wb, '.cb-cg__title', 'fontSize'), '38px');

  // --- per-block body size must reach em-sized body copy, not just px ------
  da = render(A, 'card-grid', {});
  db = render(B, 'card-grid', {}, { _bodyScale: 1.25 });
  changed('per-block body size reaches em body copy',
          px(da, wa, '.cb-cg__body', 'fontSize'), px(db, wb, '.cb-cg__body', 'fontSize'));

  // --- eyebrows that the first pass missed --------------------------------
  [['card-grid', '.cb-cg__tag'], ['logo-marquee', '.cb-mq__kicker'],
   ['bento-grid', '.cb-bn__eyebrow'], ['sticky-stack', '.cb-stk__eyebrow']].forEach(function (pair) {
    var d0 = render(A, pair[0], {});
    var d1 = render(B, pair[0], { eyebrowScale: 1.4 });
    changed('eyebrow reaches ' + pair[1], px(d0, wa, pair[1], 'fontSize'), px(d1, wb, pair[1], 'fontSize'));
  });

  // --- headings that used to inherit body leading -------------------------
  [['carousel', '.cb-car__title', {}], ['timeline', '.cb-tl__title', {}],
   ['tabs', '.cb-tabs__title', {}],
   ['spec-strip', '.cb-spec__title', { title: 'Specifications' }]].forEach(function (pair) {
    var d0 = render(A, pair[0], {}, pair[2]);
    var d1 = render(B, pair[0], { hLeading: 30 }, pair[2]);
    changed('heading leading reaches ' + pair[1],
            px(d0, wa, pair[1], 'lineHeight'), px(d1, wb, pair[1], 'lineHeight'));
  });

  // --- a logo is not a heading --------------------------------------------
  da = render(A, 'logo-marquee', {});
  db = render(B, 'logo-marquee', { hTrack: 10, hScale: 1.4 });
  check('heading controls leave logo wordmarks alone',
        px(db, wb, '.cb-mq__word', 'letterSpacing'), px(da, wa, '.cb-mq__word', 'letterSpacing'));

  // --- controls that cannot do anything are not offered -------------------
  check('logo-marquee hides per-block heading size',
        CB.fields(CB.get('logo-marquee')).some(function (f) { return f.k === '_hScale'; }), false);
  check('card-grid keeps per-block heading size',
        CB.fields(CB.get('card-grid')).some(function (f) { return f.k === '_hScale'; }), true);
  check('filtering never drops a non-typography control',
        CB.fields(CB.get('logo-marquee')).filter(function (f) { return f.k && f.k.charAt(0) === '_'; })
          .map(function (f) { return f.k; }).join(',') ===
        CB.get('logo-marquee').props.filter(function (f) { return f.k && f.k.charAt(0) === '_' && f.k !== '_hScale' && f.k !== '_hTrack'; })
          .map(function (f) { return f.k; }).join(','), true);


  /* --- every size in the library comes off the ramp ------------------------

     Drift is not a state, it compounds: between the 27-component library and
     the 30-component one the hero sizes went from seven values to ten, purely
     because each new block arrived with its own judgement. Nothing here stops
     somebody choosing a new size deliberately — it stops one arriving by
     accident, and it makes adding a role to the ramp a decision rather than a
     side effect. Read off the emitted CSS, so a comment cannot satisfy it. */

  var RAMP = {
    'clamp(32px, 6vw, 60px)':   'Display',
    'clamp(26px, 3.6vw, 38px)': 'Section title',
    'clamp(20px, 2.6vw, 28px)': 'Subsection',
    'clamp(30px, 5vw, 46px)':   'Figure',
    'clamp(16px, 2.2vw, 19px)': 'Standfirst'
  };
  /* Mosaic sizes against its tile rather than the viewport, which is the whole
     point of that block, so its cqw ramps are named rather than counted. */
  var CONTAINER_UNIT = 'cqw';
  var STEPS = ['1.12em', '1em', '.92em', '.85em', '.75em'];
  /* Four values are sized against something other than body, and each is named
     with what it hangs off. A price is a composed figure — the currency symbol
     and the affix are set against the numeral beside them rather than against
     the ramp — and a row of stars is an icon size, not type. Listing them here
     rather than loosening the pattern is the point: an unnamed exemption is
     just drift with a comment. */
  var COMPOSED = {
    '2.9em': 'the price numeral',
    '1.3em': 'the currency symbol beside it',
    '.62em': "a stat's affix",
    '1.1em': 'a row of star icons'
  };

  var libCss = CB.all().map(function (d) {
    return CB.build({ type: d.id, cls: 'ramp-' + d.id, props: CB.defaults(d) },
                    CB.DEFAULT_TOKENS, { omitBase: true }).css;
  }).join('\n');

  var strayClamp = [], strayEm = [], m;
  var reC = /font-size:[^;]*?(clamp\([^)]*\))/g;
  while ((m = reC.exec(libCss))) {
    var v = m[1].replace(/\s+/g, ' ');
    if (RAMP[v] || v.indexOf(CONTAINER_UNIT) > -1) continue;
    if (strayClamp.indexOf(v) < 0) strayClamp.push(v);
  }
  var reE = /font-size:\s*(?:calc\(\s*)?(\d*\.?\d+em)/g;
  while ((m = reE.exec(libCss))) {
    var e = m[1].replace(/^0\./, '.');
    if (STEPS.indexOf(e) > -1 || COMPOSED[e]) continue;
    if (strayEm.indexOf(e) < 0) strayEm.push(e);
  }
  check('every clamped size is a named role', strayClamp.join(', ') || 'none', 'none');
  check('every em size is a step on the ramp', strayEm.join(', ') || 'none', 'none');
  check('and the ramp is five roles, not ten', Object.keys(RAMP).length, 5);

  /* Weight is the same story with fewer values: headings are 800, everything
     under them 700. 730 / 750 / 760 / 780 were four ways of saying "a bit less
     bold" that no two blocks agreed on. */
  var weights = [];
  var reW = /font-weight:\s*var\(--cb-h-weight,\s*(\d+)\)/g;
  while ((m = reW.exec(libCss))) { if (weights.indexOf(m[1]) < 0) weights.push(m[1]); }
  check('heading weight is 700 or 800 and nothing between',
        weights.sort().join(','), '700,800');

  /* Two blocks with different vertical padding read as a mistake, because the
     eye measures the gap between them rather than the padding inside each. */
  var pads = [];
  CB.all().forEach(function (d) {
    var v = CB.defaults(d).pad;
    if (v != null && pads.indexOf(v) < 0) pads.push(v);
  });
  check('section padding is 80, a 56px strip, or a deliberate 0',
        pads.sort(function (a, b) { return a - b; }).join(','), '0,56,80');

  document.getElementById('out').textContent =
    pass + ' passed, ' + fail + ' failed\n\n' + log.join('\n');
  document.title = fail ? 'EFFECT FAIL ' + fail : 'EFFECT OK ' + pass;
});
</script>
